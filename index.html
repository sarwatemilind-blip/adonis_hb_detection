ld input,.field select{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800}.primary{background:var(--nav);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#edf3f5;color:var(--nav)}.orange{background:#fff0d9;color:#8a5b10}.danger{background:#fae6e6;color:#9c3838}.notice{padding:13px;border-radius:10px;background:#edf7fa;color:#285d6c;font-size:13px}.warning{background:#fff5df;color:#7d5818}.hero{text-align:center;padding:28px}.drop{border:2px dashed #b7cbd2;border-radius:15px;padding:22px;text-align:center;background:#fafcfd}.camera{position:relative;background:#101010;border-radius:13px;overflow:hidden;min-height:260px}.camera video{width:100%;display:block;max-height:62vh;object-fit:cover}.guide{position:absolute;inset:23% 12%;border:3px solid rgba(255,255,255,.92);border-radius:20px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}.guideText{position:absolute;left:0;right:0;top:7%;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 4px #000}.preview{width:100%;max-height:360px;object-fit:contain;background:#111;border-radius:12px}.reading{font-size:46px;font-weight:900;color:var(--nav);line-height:1.1}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pill.good{background:#e0f5ee;color:#147454}.pill.warn{background:#fff0d9;color:#986016}.pill.bad{background:#fae4e4;color:#9b3434}.metric{font-size:30px;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.modalbox{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:94vh;overflow:auto;padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.footerNote{font-size:11px;color:var(--muted);line-height:1.5}.toast{position:fixed;right:18px;bottom:18px;background:#162c35;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100}.topline{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}@media(max-width:700px){.g3,.g2{grid-template-columns:1fr}.container{padding:12px}.header{padding:10px 12px;align-items:center}.brandWrap{gap:10px}.hdr-logo.mv{max-height:40px;max-width:90px;padding:4px 7px;border-radius:8px}.hdr-logo.ag{max-height:40px;max-width:72px;padding:4px 7px;border-radius:8px}.brand{font-size:15px}.brand small{font-size:9px}.brandLogos{padding:4px 6px;gap:5px}.brandLogos img{max-height:32px}.brandLogos .mv{max-width:78px}.brandLogos .ag{max-width:66px}.reportBrand{align-items:flex-start}.reportLogos img{max-height:34px}.reportLogos .mv{max-width:90px}.reportLogos .ag{max-width:70px}.reading{font-size:40px}}.spinner{display:inline-block;width:26px;height:26px;border:3px solid rgba(18,63,77,.15);border-top-color:var(--nav);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.cam-switch{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}.cam-switch:hover{background:rgba(255,255,255,.28)}

<body>
<header class="header"><div class="brandWrap"><img class="hdr-logo mv" src="assets/MV30.png" alt="MV30"><div class="brand">ADONIS Hb SCREEN<small>Conjunctival Image Haemoglobin Screening · V2.0</small></div><img class="hdr-logo ag" src="assets/AMINO-GLOBIN-XT.png" alt="Amino Globin-XT"></div><button class="btn ghost" onclick="newScreening()">+ New Screening</button></header>
<main class="container" id="app"></main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<input id="galleryInput" class="hidden" type="file" accept="image/*" onchange="handleImageFile(event)">
<input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment" onchange="handleImageFile(event)">
<script>
const KEY='adonis_hb_screen_v2';
const ENGINE_VERSION='AI-EfficientNetB0-V1.0';
const HB_MEAN=10.359,HB_STD=2.259;
const IMG_MEAN=[0.485,0.456,0.406],IMG_STD=[0.229,0.224,0.225];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{screenings:[]};
let current={patient:{},image:null,result:null};let stream=null;
let ortSession=null,modelLoading=false,currentFacing='environment',v2Session=null,v2Loading=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function formatScreenDate(d=new Date()){return d.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'});}function formatScreenTime(d=new Date()){return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}function dashboard(){document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">Haemoglobin Screening</h1><div class="sub">Capture the lower conjunctiva and receive a conjunctiva-focused prototype Hb estimate.</div></div></div><div class="grid g3"><div class="card"><div class="sub">Total screenings</div><div class="metric">${db.screenings.length}</div></div><div class="card"><div class="sub">Today</div><div class="metric">${db.screenings.filter(x=>new Date(x.created).toDateString()===new Date().toDateString()).length}</div></div><div class="card"><div class="sub">Last reading</div><div class="metric">${db.screenings[0]?.estimate?db.screenings[0].estimate.toFixed(1)+' g/dL':'—'}</div></div></div><div class="card hero" style="margin-top:16px"><div style="font-size:42px">🩸</div><h2>Quick Hb Screening</h2><p class="sub">For use by an MR or healthcare professional during an OPD/camp. This is a screening estimate, not a laboratory Hb measurement.</p><button class="btn green" style="font-size:17px;padding:13px 22px" onclick="newScreening()">📷 Start Hb Screening</button></div><div class="card" style="margin-top:16px"><h2 class="section">Recent screenings</h2>${recent()}</div>`}
function recent(){if(!db.screenings.length)return '<div class="sub">No screenings yet.</div>';return `<table class="table"><thead><tr><th>Patient</th><th>Date</th><th>Hb</th><th>Screening</th></tr></thead><tbody>${db.screenings.slice(0,15).map(x=>`<tr><td>${esc(x.patient.name||'Anonymous')}<br><span class="sub">${esc(x.patient.age||'')} ${esc(x.patient.sex||'')}</span></td><td>${new Date(x.created).toLocaleString()}</td><td><b>${x.estimate?x.estimate.toFixed(1)+' g/dL':'—'}</b></td><td>${x.flag||'—'}</td></tr>`).join('')}</tbody></table>`}
function newScreening(){current={patient:{},image:null,result:null};document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">New Hb Screening</h1><div class="sub">Step 1 of 3 — Patient information</div></div><button class="btn ghost" onclick="dashboard()">Cancel</button></div><div class="card"><h2 class="section">Patient details</h2><div class="grid g3"><div class="field"><label>Patient name / ID</label><input id="pname" placeholder="Optional"></div><div class="field"><label>Age</label><input id="page" type="number" min="1" max="120" placeholder="Years"></div><div class="field"><label>Sex</label><select id="psex"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div></div><div class="notice" style="margin-top:16px"><b>Image target:</b> the lower palpebral conjunctiva (inside the lower eyelid). Ask the patient to look upward and gently pull the lower eyelid down.</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn green" onclick="openCapture()">Continue to Eye Capture →</button></div></div>`}
function openCapture(){current.patient={name:document.getElementById('pname').value.trim(),age:document.getElementById('page').value,sex:document.getElementById('psex').value};document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">Capture Eye Photograph</h1><div class="sub">Step 2 of 3 — Lower conjunctiva image</div></div><button class="btn ghost" onclick="newScreening()">← Back</button></div><div class="card"><div class="notice">Use bright, even ambient light. Avoid flash/glare. Centre the lower conjunctiva inside the guide. A clear, close image is essential for any meaningful estimate.</div><div class="grid g2" style="margin-top:16px"><div class="drop"><div style="font-size:38px">📷</div><h3>Camera</h3><p class="sub">Open the phone camera and capture the eye directly.</p><button class="btn primary" onclick="openCamera()">📷 Open Camera</button></div><div class="drop"><div style="font-size:38px">🖼️</div><h3>Gallery</h3><p class="sub">Choose an existing close-up photograph.</p><button class="btn ghost" onclick="document.getElementById('galleryInput').click()">Choose Photo</button></div></div><div id="imageResult" style="margin-top:16px"></div></div>`}
async function openCamera(){const secure=window.isSecureContext||location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';if(!navigator.mediaDevices?.getUserMedia||!secure){document.getElementById('cameraInput').value='';document.getElementById('cameraInput').click();return}document.getElementById('modalBox').innerHTML=`<div class="row between"><h2 class="section" style="margin:0">📷 Capture Eye</h2><div class="row" style="gap:8px"><button id="camSwitchBtn" class="cam-switch" onclick="switchCamera()">🤳 Selfie</button><button class="btn ghost" onclick="closeCamera()">Close</button></div></div><p class="sub">Position the lower conjunctiva inside the guide.</p><div class="camera"><video id="video" autoplay playsinline muted></video><div class="guide"></div><div class="guideText">LOWER CONJUNCTIVA</div></div><canvas id="canvas" class="hidden"></canvas><div id="camMsg" class="sub" style="text-align:center;margin:10px">Requesting camera permission…</div><div class="row" style="justify-content:center"><button class="btn green" onclick="capture()">● Capture Photo</button></div>`;document.getElementById('modal').classList.remove('hidden');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});let v=document.getElementById('video');v.srcObject=stream;await v.play();document.getElementById('camMsg').textContent='Camera ready. Centre the conjunctiva and capture.'}catch(e){closeCamera();document.getElementById('cameraInput').value='';document.getElementById('cameraInput').click();toast('Opening the phone camera…')}}
function closeCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('modal').classList.add('hidden')}
function capture(){let v=document.getElementById('video'),c=document.getElementById('canvas');if(!v?.videoWidth){toast('Camera is not ready');return}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{closeCamera();if(b)handleImageFile({target:{files:[new File([b],'eye.jpg',{type:'image/jpeg'})]}})},'image/jpeg',.92)}
let cropperInstance = null;
function handleImageFile(ev){let f=ev.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Please choose an image');return}current.originalFile=f;let url=URL.createObjectURL(f);
  document.getElementById('modalBox').innerHTML=`<div class="row between"><h2 class="section" style="margin:0">✂️ Crop Eye</h2><button class="btn ghost" onclick="closeCamera()">Cancel</button></div><p class="sub">Drag to crop tightly around the eye. Exclude surrounding skin/lips.</p><div style="max-height:60vh;margin:14px 0;background:#000"><img id="cropImg" src="${url}" style="max-width:100%;display:block;"></div><div class="row" style="justify-content:flex-end"><button class="btn green" onclick="doCropAndAnalyze()">Crop & Analyze →</button></div>`;
  document.getElementById('modal').classList.remove('hidden');
  const image=document.getElementById('cropImg');
  image.onload=()=>{cropperInstance=new Cropper(image,{viewMode:1,dragMode:'crop',autoCropArea:0.8,restore:false,guides:true,center:true,highlight:false,cropBoxMovable:true,cropBoxResizable:true,toggleDragModeOnDblclick:false});};
}
function tryAnotherCrop() { if(current.originalFile) { handleImageFile({target:{files:[current.originalFile]}}); } else { openCapture(); } }
function doCropAndAnalyze(){if(!cropperInstance)return;const canvas=cropperInstance.getCroppedCanvas();if(!canvas){toast('Could not crop image');return}
  canvas.toBlob(b=>{closeCamera();if(b){let url=URL.createObjectURL(b);let img=new Image();img.onload=()=>{current.image={url,file:b};analyse(img,url);};img.onerror=()=>toast('Could not read the cropped image');img.src=url;}},'image/jpeg',1.0);
}
async function loadOrtModel(){if(ortSession)return ortSession;if(modelLoading)return new Promise((res,rej)=>{const iv=setInterval(()=>{if(ortSession){clearInterval(iv);res(ortSession);}},150);setTimeout(()=>{clearInterval(iv);if(!ortSession)rej(new Error('Model load timeout'));},60000);});modelLoading=true;ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/';ortSession=await ort.InferenceSession.create('model.onnx',{executionProviders:['wasm']});modelLoading=false;return ortSession;}
async function loadV2Model(){if(v2Session)return v2Session;if(v2Loading)return new Promise((res,rej)=>{const iv=setInterval(()=>{if(v2Session){clearInterval(iv);res(v2Session);}},150);setTimeout(()=>{clearInterval(iv);if(!v2Session)rej(new Error('V2 Model load timeout'));},60000);});v2Loading=true;try{v2Session=await ort.InferenceSession.create('eye_app_training_v1/hgb_regressor_image_only.onnx',{executionProviders:['wasm']});}catch(e){console.error(e);}v2Loading=false;return v2Session;}
function switchCamera(){currentFacing=currentFacing==='environment'?'user':'environment';const btn=document.getElementById('camSwitchBtn');if(btn)btn.textContent=currentFacing==='environment'?'🤳 Selfie':'📷 Back cam';if(!stream)return;stream.getTracks().forEach(t=>t.stop());stream=null;const v=document.getElementById('video');if(!v)return;navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:currentFacing},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;v.srcObject=s;v.play();}).catch(()=>toast('Could not switch camera'));}
async function analyse(img,url){
  const resDiv=document.getElementById('imageResult');
  if(resDiv)resDiv.innerHTML='<div class="card" style="padding:20px;text-align:center"><span class="spinner"></span><span style="color:var(--muted);font-size:14px">Preparing…</span></div>';
  const max=1400;
  const scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;

  // V2: deterministic conjunctiva-focused region proposal.
  // We first exclude the outer 15% of the image (background/skin) and score small
  // patches for pink/red, moderately bright, low-glare tissue. The highest-scoring
  // connected patch is used as the analysis ROI. This is a prototype image-processing
  // step, NOT a clinically validated conjunctiva segmentation model.
  const x0=Math.floor(w*.15), x1=Math.floor(w*.85), y0=Math.floor(h*.18), y1=Math.floor(h*.82);
  const patchW=Math.max(24,Math.floor(w*.18)), patchH=Math.max(18,Math.floor(h*.16));
  let best=null;
  for(let py=y0;py<=y1-patchH;py+=Math.max(8,Math.floor(patchH/3))){
    for(let px=x0;px<=x1-patchW;px+=Math.max(8,Math.floor(patchW/3))){
      let score=0, count=0, meanL=0, red=0, green=0, blue=0, glare=0;
      for(let yy=py;yy<py+patchH;yy+=2){
        for(let xx=px;xx<px+patchW;xx+=2){
          const i=(yy*w+xx)*4,R=d[i],G=d[i+1],B=d[i+2];
          const L=.299*R+.587*G+.114*B;
          const chroma=Math.max(R,G,B)-Math.min(R,G,B);
          const pink=(R-G)*.8+(R-B)*.35;
          if(L>35&&L<225){
            count++; meanL+=L; red+=R; green+=G; blue+=B;
            if(L>245)glare++;
            // favour pink/red tissue while penalising extreme saturation and darkness
            score += Math.max(0,pink) + Math.max(0,chroma*.08) - Math.abs(L-135)*.012;
          }
        }
      }
      if(count>30){
        const q=score/count;
        if(!best || q>best.score) best={x:px,y:py,w:patchW,h:patchH,score:q,count,meanL:meanL/count,r:red/count,g:green/count,b:blue/count};
      }
    }
  }

  // Fallback: central ROI if no candidate is found.
  if(!best){
    best={x:Math.floor(w*.25),y:Math.floor(h*.30),w:Math.floor(w*.5),h:Math.floor(h*.4),score:0};
  }

  // Expand the candidate modestly so the analysis is not driven by a tiny patch.
  const padX=Math.floor(best.w*.35), padY=Math.floor(best.h*.30);
  const rx=Math.max(0,best.x-padX), ry=Math.max(0,best.y-padY);
  const rw=Math.min(w-rx,best.w+2*padX), rh=Math.min(h-ry,best.h+2*padY);

  let r=0,g=0,b=0,n=0,lum=0,redPx=0,glarePx=0,blurProxy=0;
  for(let yy=ry;yy<ry+rh;yy++){
    for(let xx=rx;xx<rx+rw;xx++){
      const i=(yy*w+xx)*4,R=d[i],G=d[i+1],B=d[i+2];
      const L=.299*R+.587*G+.114*B;
      if(L>25&&L<245){
        r+=R;g+=G;b+=B;lum+=L;n++;
        if(R>G*1.10&&R>B*1.12)redPx++;
      } else if(L>=245) glarePx++;
    }
  }
  if(!n){if(resDiv)resDiv.innerHTML='<div class="card" style="padding:20px"><div class="notice warning">The image could not be assessed. Please capture a clear, well-lit close-up of the lower conjunctiva.</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="openCapture()">🔄 Retake</button></div></div>';return;}
  r/=n;g/=n;b/=n;lum/=n;
  const chroma=(Math.max(r,g,b)-Math.min(r,g,b))/(r+g+b+1);
  const redFrac=redPx/n,glareFrac=glarePx/(rw*rh);
  // Blur detection (Laplacian mean absolute value, sampled every 4px)
  let lapSum=0,lapN=0;
  for(let yy=2;yy<h-2;yy+=4){for(let xx=2;xx<w-2;xx+=4){
    const gL=(row,col)=>{const p=(row*w+col)*4;return .299*d[p]+.587*d[p+1]+.114*d[p+2];};
    lapSum+=Math.abs(4*gL(yy,xx)-gL(yy-1,xx)-gL(yy+1,xx)-gL(yy,xx-1)-gL(yy,xx+1));lapN++;
  }}
  const blurScore=lapN>0?lapSum/lapN:10;
  // Quality flags
  let quality='Good';
  if(img.width<500||img.height<500)quality='Needs review';
  if(lum<50||lum>230)quality='Needs review';
  if(glareFrac>.20)quality='Needs review';
  if(redFrac<.018||chroma<.04)quality='Needs review';
  if(best.score<2)quality='Needs review';
  if(blurScore<1.2&&img.width>=600)quality='Needs review';
  // Hard quality gate — image is unusable
  if(lum<20||lum>242||glareFrac>.50||(redFrac<.003&&best.score<0.3)){
    if(resDiv)resDiv.innerHTML='<div class="card" style="padding:20px"><div class="notice warning">⚠️ <b>Image quality insufficient. Please retake.</b> Ensure bright ambient lighting and the lower eyelid is clearly visible.</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="openCapture()">🔄 Retake</button></div></div>';
    return;
  }
  // Show loading indicator while AI model is loaded and runs
  if(resDiv)resDiv.innerHTML='<div class="card" style="padding:20px;text-align:center"><span class="spinner"></span><span style="color:var(--muted);font-size:14px">Running AI model — first load may take 15–20 s…</span></div>';
  // Crop ROI to 224×224 canvas for model input
  const roiC=document.createElement('canvas');roiC.width=224;roiC.height=224;
  roiC.getContext('2d').drawImage(c,rx,ry,rw,rh,0,0,224,224);
  try{
    const session=await loadOrtModel();
    // Preprocess: RGBA pixels → CHW float32 tensor with ImageNet normalisation
    const px4=roiC.getContext('2d',{willReadFrequently:true}).getImageData(0,0,224,224).data;
    const tData=new Float32Array(3*224*224);
    for(let i=0;i<224*224;i++){
      tData[i]=(px4[i*4]/255-IMG_MEAN[0])/IMG_STD[0];
      tData[224*224+i]=(px4[i*4+1]/255-IMG_MEAN[1])/IMG_STD[1];
      tData[2*224*224+i]=(px4[i*4+2]/255-IMG_MEAN[2])/IMG_STD[2];
    }
    const inp=new ort.Tensor('float32',tData,[1,3,224,224]);
    const feeds={};feeds[session.inputNames[0]]=inp;
    const out=await session.run(feeds);
    const clsD=out[session.outputNames[0]].data;
    const hbD=out[session.outputNames[1]].data;
    // Anemia probability: single logit → sigmoid, or 2-class → softmax
    const clsSz=out[session.outputNames[0]].dims.reduce((a,b)=>a*b,1);
    let probAnemic;
    if(clsSz===1){probAnemic=1/(1+Math.exp(-clsD[0]));}
    else{const e=Array.from(clsD).map(x=>Math.exp(x));probAnemic=e[1]/(e[0]+e[1]);}
    // Hb estimate: model outputs z-score → denormalise with training stats
    let hbEstimate=hbD[0]*HB_STD+HB_MEAN;
    if(hbEstimate<4||hbEstimate>22)hbEstimate=hbD[0]; // fallback if already in g/dL
    hbEstimate=Math.max(4,Math.min(20,Math.round(hbEstimate*10)/10));
    const flag=probAnemic>0.5?'Anaemia screening indicator: Present':'Anaemia screening indicator: Not prominent';
    let hbEstimateV2 = null;
    let v2QualityScore = 0;
    let v2Error = null;
    let rawHbV2 = null;
    try {
      const sessionV2 = await loadV2Model();
      if(sessionV2 && typeof extractCombinedFeatures === 'function') {
        const fullImageData = c.getContext('2d',{willReadFrequently:true}).getImageData(rx,ry,rw,rh);
        const feats = extractCombinedFeatures(fullImageData);
        v2QualityScore = calculateCropQualityScore(feats);
        
        const inpV2 = new ort.Tensor('float32', feats, [1, 84]);
        const feedsV2 = {}; feedsV2[sessionV2.inputNames[0]] = inpV2;
        const outV2 = await sessionV2.run(feedsV2);
        rawHbV2 = outV2[sessionV2.outputNames[0]].data[0];
        
        if (v2QualityScore >= 50) {
            hbEstimateV2 = rawHbV2;
        } else {
            v2Error = "Unable to estimate Hb reliably from this image. Please retake the photograph with the lower conjunctiva clearly visible.";
        }
      } else {
        v2Error = "Unable to estimate Hb at this time. Please check your connection and try again.";
      }
    } catch(e2) {
      console.error('V2 inference error:', e2);
      v2Error = "Unable to estimate Hb at this time. Please check your connection and try again.";
    }
    
    // Log V1 internally for debug comparison
    console.log('[DEBUG] V1 Estimate:', hbEstimate, '| V2 Estimate:', hbEstimateV2, '| V2 Quality:', v2QualityScore);

    let finalEstimate = hbEstimateV2 !== null ? Math.max(4, Math.min(20, Math.round(hbEstimateV2 * 10) / 10)) : null;
    let finalProb = finalEstimate !== null ? (finalEstimate < 11.0 ? 0.9 : 0.1) : null;
    let finalFlag = finalEstimate !== null ? (finalEstimate < 11.0 ? 'Anaemia screening indicator: Present' : 'Anaemia screening indicator: Not prominent') : 'Anaemia screening indicator: Unknown';
    let finalQuality = (v2QualityScore >= 50) ? 'Good' : 'Poor';

    current.result={
      estimate: finalEstimate,
      v1EstimateDebug: hbEstimate,
      v2QualityScore: v2QualityScore,
      v2Error: v2Error,
      probAnemic: finalProb,
      quality: finalQuality,
      flag: finalFlag,
      engine: 'Indian conjunctival model',
      cameraFacing: currentFacing
    };
    showImage(url,current.result);
  }catch(e){
    console.error('AI inference:',e);
    if(resDiv)resDiv.innerHTML='<div class="card" style="padding:20px"><div class="notice warning">⚠️ AI analysis could not be completed. Please check your internet connection (the AI model requires ~18 MB on first load) and try again.</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="openCapture()">🔄 Retake</button></div></div>';
  }
}
function showImage(url,res){document.getElementById('imageResult').innerHTML=`<div class="card" style="padding:14px"><img class="preview" src="${url}" alt="Captured lower conjunctiva"><div style="margin-top:14px">${(res && res.estimate !== null)?`<div class="grid g2"><div><div class="sub">Estimated Hb</div><div class="reading">${res.estimate.toFixed(1)} <span style="font-size:20px">g/dL</span></div><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px"><span class="pill ${res.quality==='Good'?'good':'warn'}">Image quality: ${res.quality}</span></div><div class="footerNote" style="margin-top:8px">Engine: ${res.engine} · Camera: ${res.cameraFacing==='environment'?'Back':'Front'}</div></div><div><div class="sub">Screening observation</div><h3 style="margin:8px 0">${res.flag}</h3><p class="sub">This is an image-derived screening estimate only. Confirm with laboratory Hb/CBC before clinical decisions.</p></div></div>`:(res && res.v2Error)?`<div class="notice warning">${res.v2Error}</div>`:'<div class="notice warning">The image could not be assessed. Please capture a clear, well-lit close-up of the lower conjunctiva.</div>'}<div class="row" style="justify-content:flex-end;margin-top:14px;flex-wrap:wrap;gap:8px"><button class="btn ghost" onclick="openCapture()">Choose New Photograph</button><button class="btn primary" onclick="tryAnotherCrop()">Try Another Crop</button>${(res && res.estimate !== null)?'<button class="btn green" onclick="showReport()">Continue to Report →</button>':''}</div></div></div>`}
function showReport(){document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">Hb Screening Report</h1><div class="sub">Step 3 of 3 — Review and share</div></div></div><div class="card" id="report"><div class="reportBrand"><div><h2 style="margin:0">ADONIS Hb SCREEN</h2><div class="sub">Conjunctival image haemoglobin screening</div></div><div class="reportLogos"><img class="mv" src="assets/MV30.png" alt="MV30"><img class="ag" src="assets/AMINO-GLOBIN-XT.png" alt="Amino Globin-XT"></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="grid g3"><div><div class="sub">Patient</div><b>${esc(current.patient.name||'Not provided')}</b></div><div><div class="sub">Age / Sex</div><b>${esc(current.patient.age||'—')} / ${esc(current.patient.sex||'—')}</b></div><div><div class="sub">Screening Date</div><b>${formatScreenDate()}</b><div class="sub" style="margin-top:3px">Time: ${formatScreenTime()}</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card" style="box-shadow:none;text-align:center"><div class="sub">Estimated Hb</div><div class="reading">${current.result.estimate !== null ? current.result.estimate.toFixed(1) + ' g/dL' : 'Not available'}</div><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;justify-content:center"><span class="pill ${current.result.quality==='Good'?'good':'warn'}">Image quality: ${current.result.quality}</span></div></div><div class="card" style="box-shadow:none"><div class="sub">Screening observation</div><h3>${current.result.flag}</h3><p class="sub">This AI screening estimate is derived from a conjunctival photograph. It is not equivalent to a laboratory haemoglobin measurement.</p></div></div><div class="footerNote" style="margin-top:14px">Engine: ${current.result.engine} · Camera: ${current.result.cameraFacing==='environment'?'Back':'Front'} · ${formatScreenDate()} ${formatScreenTime()}</div><div class="notice warning" style="margin-top:16px"><b>Clinical safety:</b> Confirm haemoglobin with an appropriate laboratory/validated measurement before diagnosis, treatment or other clinical decisions. Do not rely on this screening estimate alone.</div></div><div class="row" style="justify-content:flex-end;margin-top:16px;flex-wrap:wrap;gap:8px"><button class="btn ghost" onclick="openCapture()">Choose New Photograph</button><button class="btn primary" onclick="tryAnotherCrop()">Try Another Crop</button><button class="btn primary" onclick="shareReport()">📤 Send to Doctor</button><button class="btn ghost" onclick="window.print()">🖨 Print / Save PDF</button><button class="btn green" onclick="saveAndNew()">Save & Next Patient →</button></div>`}
function reportText(){return `ADONIS Hb SCREEN — HAEMOGLOBIN SCREENING\nScreening Date: ${formatScreenDate()}\nScreening Time: ${formatScreenTime()}\nPatient: ${current.patient.name||'Not provided'}\nAge/Sex: ${current.patient.age||'—'} / ${current.patient.sex||'—'}\nEstimated Hb: ${current.result.estimate !== null ? current.result.estimate.toFixed(1) + ' g/dL' : 'Not available (Image quality insufficient)'}\nImage quality: ${current.result.quality}\nScreening observation: ${current.result.flag}\n\nThis is an image-derived screening estimate from a lower-conjunctival photograph. Confirm with laboratory/validated haemoglobin measurement before clinical decisions.`}
async function shareReport(){let text=reportText();if(navigator.share){try{await navigator.share({title:'Adonis Hb Screening Report',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);toast('Report copied. Paste into WhatsApp/email.')}}
function saveAndNew(){db.screenings.unshift({id:crypto.randomUUID?.()||Date.now().toString(),created:Date.now(),patient:current.patient,estimate:current.result.estimate,quality:current.result.quality,flag:current.result.flag});save();toast('Screening saved');setTimeout(()=>newScreening(),400)}
function dashboardInit(){dashboard()}dashboardInit();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function calculateCropQualityScore(feats) {
  let score = 100;
  const R_p10 = feats[2], R_p90 = feats[3], G_p10 = feats[6], G_p90 = feats[7];
  const S_mean = feats[17], V_mean = feats[19], a_mean = feats[23];
  
  // Base penalties
  if (a_mean < 140) score -= (140 - a_mean) * 2.5; 
  if (S_mean < 90) score -= (90 - S_mean) * 1.0;   
  if (V_mean < 70) score -= (70 - V_mean) * 1.5;   
  if (V_mean > 210) score -= (V_mean - 210) * 1.5; 
  
  // Extreme exposure penalties
  if (R_p10 < 0.15 && G_p10 < 0.15) score -= 15;   
  if (R_p90 > 0.95 && G_p90 > 0.95) score -= 15;   
  
  // Specific forehead/skin heuristic: Borderline redness + lack of bright sclera
  if (a_mean < 143 && S_mean < 105 && R_p90 < 0.80) {
      score -= 50; // Heavily penalize pure skin patches lacking bright eye whites or deep redness
  }

  return Math.max(0, Math.round(score));
}
