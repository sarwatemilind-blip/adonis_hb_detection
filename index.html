<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f4d">
<meta name="description" content="Adonis Hb Screen - smartphone conjunctival image haemoglobin screening prototype">
<link rel="manifest" href="manifest.json">
<title>Adonis Hb Screen</title>
<style>
:root{--nav:#123f4d;--nav2:#185b6c;--bg:#f4f7f8;--card:#fff;--text:#1c2a34;--muted:#687884;--line:#dce5e9;--green:#18a67c;--orange:#d88918;--red:#c94c4c;--shadow:0 5px 18px rgba(20,40,50,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.header{background:var(--nav);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brandWrap{display:flex;align-items:center;gap:18px;flex:1}.hdr-logo{display:block;object-fit:contain;background:#fff;border-radius:12px;padding:7px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}.hdr-logo.mv{max-height:62px;max-width:150px;width:auto}.hdr-logo.ag{max-height:62px;max-width:120px;width:auto}.brand{font-size:22px;font-weight:800;flex:1;text-align:center}.brand small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:3px}.brandLogos{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:6px 9px}.brandLogos img{display:block;object-fit:contain;max-height:46px;width:auto}.brandLogos .mv{max-width:120px}.brandLogos .ag{max-width:92px}.reportBrand{display:flex;align-items:center;justify-content:space-between;gap:14px}.reportLogos{display:flex;align-items:center;gap:10px}.reportLogos img{max-height:48px;width:auto;object-fit:contain}.reportLogos .mv{max-width:130px}.reportLogos .ag{max-width:95px}.container{max-width:1050px;margin:auto;padding:20px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.title{font-size:25px;margin:0}.sub{color:var(--muted);font-size:13px}.section{font-size:18px;font-weight:800;margin:0 0 14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800}.primary{background:var(--nav);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#edf3f5;color:var(--nav)}.orange{background:#fff0d9;color:#8a5b10}.danger{background:#fae6e6;color:#9c3838}.notice{padding:13px;border-radius:10px;background:#edf7fa;color:#285d6c;font-size:13px}.warning{background:#fff5df;color:#7d5818}.hero{text-align:center;padding:28px}.drop{border:2px dashed #b7cbd2;border-radius:15px;padding:22px;text-align:center;background:#fafcfd}.camera{position:relative;background:#101010;border-radius:13px;overflow:hidden;min-height:260px}.camera video{width:100%;display:block;max-height:62vh;object-fit:cover}.guide{position:absolute;inset:23% 12%;border:3px solid rgba(255,255,255,.92);border-radius:20px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}.guideText{position:absolute;left:0;right:0;top:7%;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 4px #000}.preview{width:100%;max-height:360px;object-fit:contain;background:#111;border-radius:12px}.reading{font-size:46px;font-weight:900;color:var(--nav);line-height:1.1}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.pill.good{background:#e0f5ee;color:#147454}.pill.warn{background:#fff0d9;color:#986016}.pill.bad{background:#fae4e4;color:#9b3434}.metric{font-size:30px;font-weight:900}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.modalbox{background:#fff;border-radius:16px;width:100%;max-width:720px;max-height:94vh;overflow:auto;padding:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.footerNote{font-size:11px;color:var(--muted);line-height:1.5}.toast{position:fixed;right:18px;bottom:18px;background:#162c35;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:100}.topline{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}@media(max-width:700px){.g3,.g2{grid-template-columns:1fr}.container{padding:12px}.header{padding:10px 12px;align-items:center}.brandWrap{gap:10px}.hdr-logo.mv{max-height:40px;max-width:90px;padding:4px 7px;border-radius:8px}.hdr-logo.ag{max-height:40px;max-width:72px;padding:4px 7px;border-radius:8px}.brand{font-size:15px}.brand small{font-size:9px}.brandLogos{padding:4px 6px;gap:5px}.brandLogos img{max-height:32px}.brandLogos .mv{max-width:78px}.brandLogos .ag{max-width:66px}.reportBrand{align-items:flex-start}.reportLogos img{max-height:34px}.reportLogos .mv{max-width:90px}.reportLogos .ag{max-width:70px}.reading{font-size:40px}}
</style>
</head>
<body>
<header class="header"><div class="brandWrap"><img class="hdr-logo mv" src="assets/MV30.png" alt="MV30"><div class="brand">ADONIS Hb SCREEN<small>Conjunctival Image Haemoglobin Screening · V2.0</small></div><img class="hdr-logo ag" src="assets/AMINO-GLOBIN-XT.png" alt="Amino Globin-XT"></div><button class="btn ghost" onclick="newScreening()">+ New Screening</button></header>
<main class="container" id="app"></main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<div id="toast" class="toast"></div>
<input id="galleryInput" class="hidden" type="file" accept="image/*" onchange="handleImageFile(event)">
<input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment" onchange="handleImageFile(event)">
<script>
const KEY='adonis_hb_screen_v2';
const ENGINE_VERSION='HB-CONJ-ROI-V2.0';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{screenings:[]};
let current={patient:{},image:null,result:null};let stream=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function formatScreenDate(d=new Date()){return d.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'});}function formatScreenTime(d=new Date()){return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}function dashboard(){document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">Haemoglobin Screening</h1><div class="sub">Capture the lower conjunctiva and receive a conjunctiva-focused prototype Hb estimate.</div></div></div><div class="grid g3"><div class="card"><div class="sub">Total screenings</div><div class="metric">${db.screenings.length}</div></div><div class="card"><div class="sub">Today</div><div class="metric">${db.screenings.filter(x=>new Date(x.created).toDateString()===new Date().toDateString()).length}</div></div><div class="card"><div class="sub">Last reading</div><div class="metric">${db.screenings[0]?.estimate?db.screenings[0].estimate.toFixed(1)+' g/dL':'—'}</div></div></div><div class="card hero" style="margin-top:16px"><div style="font-size:42px">🩸</div><h2>Quick Hb Screening</h2><p class="sub">For use by an MR or healthcare professional during an OPD/camp. This is a screening estimate, not a laboratory Hb measurement.</p><button class="btn green" style="font-size:17px;padding:13px 22px" onclick="newScreening()">📷 Start Hb Screening</button></div><div class="card" style="margin-top:16px"><h2 class="section">Recent screenings</h2>${recent()}</div>`}
function recent(){if(!db.screenings.length)return '<div class="sub">No screenings yet.</div>';return `<table class="table"><thead><tr><th>Patient</th><th>Date</th><th>Hb</th><th>Screening</th></tr></thead><tbody>${db.screenings.slice(0,15).map(x=>`<tr><td>${esc(x.patient.name||'Anonymous')}<br><span class="sub">${esc(x.patient.age||'')} ${esc(x.patient.sex||'')}</span></td><td>${new Date(x.created).toLocaleString()}</td><td><b>${x.estimate?x.estimate.toFixed(1)+' g/dL':'—'}</b></td><td>${x.flag||'—'}</td></tr>`).join('')}</tbody></table>`}
function newScreening(){current={patient:{},image:null,result:null};document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">New Hb Screening</h1><div class="sub">Step 1 of 3 — Patient information</div></div><button class="btn ghost" onclick="dashboard()">Cancel</button></div><div class="card"><h2 class="section">Patient details</h2><div class="grid g3"><div class="field"><label>Patient name / ID</label><input id="pname" placeholder="Optional"></div><div class="field"><label>Age</label><input id="page" type="number" min="1" max="120" placeholder="Years"></div><div class="field"><label>Sex</label><select id="psex"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div></div><div class="notice" style="margin-top:16px"><b>Image target:</b> the lower palpebral conjunctiva (inside the lower eyelid). Ask the patient to look upward and gently pull the lower eyelid down.</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn green" onclick="openCapture()">Continue to Eye Capture →</button></div></div>`}
function openCapture(){current.patient={name:document.getElementById('pname').value.trim(),age:document.getElementById('page').value,sex:document.getElementById('psex').value};document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">Capture Eye Photograph</h1><div class="sub">Step 2 of 3 — Lower conjunctiva image</div></div><button class="btn ghost" onclick="newScreening()">← Back</button></div><div class="card"><div class="notice">Use bright, even ambient light. Avoid flash/glare. Centre the lower conjunctiva inside the guide. A clear, close image is essential for any meaningful estimate.</div><div class="grid g2" style="margin-top:16px"><div class="drop"><div style="font-size:38px">📷</div><h3>Camera</h3><p class="sub">Open the phone camera and capture the eye directly.</p><button class="btn primary" onclick="openCamera()">📷 Open Camera</button></div><div class="drop"><div style="font-size:38px">🖼️</div><h3>Gallery</h3><p class="sub">Choose an existing close-up photograph.</p><button class="btn ghost" onclick="document.getElementById('galleryInput').click()">Choose Photo</button></div></div><div id="imageResult" style="margin-top:16px"></div></div>`}
async function openCamera(){const secure=window.isSecureContext||location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';if(!navigator.mediaDevices?.getUserMedia||!secure){document.getElementById('cameraInput').value='';document.getElementById('cameraInput').click();return}document.getElementById('modalBox').innerHTML=`<div class="row between"><h2 class="section" style="margin:0">📷 Capture Eye</h2><button class="btn ghost" onclick="closeCamera()">Close</button></div><p class="sub">Position the lower conjunctiva inside the guide.</p><div class="camera"><video id="video" autoplay playsinline muted></video><div class="guide"></div><div class="guideText">LOWER CONJUNCTIVA</div></div><canvas id="canvas" class="hidden"></canvas><div id="camMsg" class="sub" style="text-align:center;margin:10px">Requesting camera permission…</div><div class="row" style="justify-content:center"><button class="btn green" onclick="capture()">● Capture Photo</button></div>`;document.getElementById('modal').classList.remove('hidden');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});let v=document.getElementById('video');v.srcObject=stream;await v.play();document.getElementById('camMsg').textContent='Camera ready. Centre the conjunctiva and capture.'}catch(e){closeCamera();document.getElementById('cameraInput').value='';document.getElementById('cameraInput').click();toast('Opening the phone camera…')}}
function closeCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById('modal').classList.add('hidden')}
function capture(){let v=document.getElementById('video'),c=document.getElementById('canvas');if(!v?.videoWidth){toast('Camera is not ready');return}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{closeCamera();if(b)handleImageFile({target:{files:[new File([b],'eye.jpg',{type:'image/jpeg'})]}})},'image/jpeg',.92)}
function handleImageFile(ev){let f=ev.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Please choose an image');return}let url=URL.createObjectURL(f);let img=new Image();img.onload=()=>{current.image={url,file:f};analyse(img,url)};img.onerror=()=>toast('Could not read the image');img.src=url}
function analyse(img,url){
  const max=1400;
  const scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;

  // V2: deterministic conjunctiva-focused region proposal.
  // We first exclude the outer 15% of the image (background/skin) and score small
  // patches for pink/red, moderately bright, low-glare tissue. The highest-scoring
  // connected patch is used as the analysis ROI. This is a prototype image-processing
  // step, NOT a clinically validated conjunctiva segmentation model.
  const x0=Math.floor(w*.15), x1=Math.floor(w*.85), y0=Math.floor(h*.18), y1=Math.floor(h*.82);
  const patchW=Math.max(24,Math.floor(w*.18)), patchH=Math.max(18,Math.floor(h*.16));
  let best=null;
  for(let py=y0;py<=y1-patchH;py+=Math.max(8,Math.floor(patchH/3))){
    for(let px=x0;px<=x1-patchW;px+=Math.max(8,Math.floor(patchW/3))){
      let score=0, count=0, meanL=0, red=0, green=0, blue=0, glare=0;
      for(let yy=py;yy<py+patchH;yy+=2){
        for(let xx=px;xx<px+patchW;xx+=2){
          const i=(yy*w+xx)*4,R=d[i],G=d[i+1],B=d[i+2];
          const L=.299*R+.587*G+.114*B;
          const chroma=Math.max(R,G,B)-Math.min(R,G,B);
          const pink=(R-G)*.8+(R-B)*.35;
          if(L>35&&L<225){
            count++; meanL+=L; red+=R; green+=G; blue+=B;
            if(L>245)glare++;
            // favour pink/red tissue while penalising extreme saturation and darkness
            score += Math.max(0,pink) + Math.max(0,chroma*.08) - Math.abs(L-135)*.012;
          }
        }
      }
      if(count>30){
        const q=score/count;
        if(!best || q>best.score) best={x:px,y:py,w:patchW,h:patchH,score:q,count,meanL:meanL/count,r:red/count,g:green/count,b:blue/count};
      }
    }
  }

  // Fallback: central ROI if no candidate is found.
  if(!best){
    best={x:Math.floor(w*.25),y:Math.floor(h*.30),w:Math.floor(w*.5),h:Math.floor(h*.4),score:0};
  }

  // Expand the candidate modestly so the analysis is not driven by a tiny patch.
  const padX=Math.floor(best.w*.35), padY=Math.floor(best.h*.30);
  const rx=Math.max(0,best.x-padX), ry=Math.max(0,best.y-padY);
  const rw=Math.min(w-rx,best.w+2*padX), rh=Math.min(h-ry,best.h+2*padY);

  let r=0,g=0,b=0,n=0,lum=0,redPx=0,glarePx=0,blurProxy=0;
  for(let yy=ry;yy<ry+rh;yy++){
    for(let xx=rx;xx<rx+rw;xx++){
      const i=(yy*w+xx)*4,R=d[i],G=d[i+1],B=d[i+2];
      const L=.299*R+.587*G+.114*B;
      if(L>25&&L<245){
        r+=R;g+=G;b+=B;lum+=L;n++;
        if(R>G*1.10&&R>B*1.12)redPx++;
      } else if(L>=245) glarePx++;
    }
  }
  if(!n){showImage(url,null);return;}
  r/=n;g/=n;b/=n;lum/=n;
  const redness=(r-g)/(r+g+b+1);
  const chroma=(Math.max(r,g,b)-Math.min(r,g,b))/(r+g+b+1);
  const redFrac=redPx/n, glareFrac=glarePx/(rw*rh);

  // Deterministic prototype heuristic applied ONLY to the selected ROI.
  // The numeric Hb output is not clinically validated.
  let raw=7 + Math.max(0,Math.min(8,((redness+0.015)/0.065)*8));
  let estimate=Math.max(7,Math.min(15,Math.round(raw*10)/10));

  let quality='Good';
  if(img.width<700||img.height<700) quality='Needs review';
  if(lum<60||lum>220||glareFrac>.16||redFrac<.025||chroma<.045) quality='Needs review';
  if(best.score<3) quality='Needs review';

  const flag=estimate<11?'Anaemia screening indicator: Present':'Anaemia screening indicator: Not prominent';
  current.result={estimate,quality,flag,engine:ENGINE_VERSION,roi:{x:rx/w,y:ry/h,w:rw/w,h:rh/h},metrics:{meanRGB:[Math.round(r),Math.round(g),Math.round(b)],meanLuma:+lum.toFixed(1),redFraction:+redFrac.toFixed(3),chroma:+chroma.toFixed(3)}};
  showImage(url,current.result);
}
function showImage(url,res){document.getElementById('imageResult').innerHTML=`<div class="card" style="padding:14px"><img class="preview" src="${url}" alt="Captured lower conjunctiva"><div style="margin-top:14px">${res?`<div class="grid g2"><div><div class="sub">Estimated haemoglobin</div><div class="reading">${res.estimate.toFixed(1)} <span style="font-size:20px">g/dL</span></div><span class="pill ${res.quality==='Good'?'good':'warn'}">Image quality: ${res.quality}</span><div class="footerNote" style="margin-top:8px">Analysis engine: ${res.engine} · Conjunctiva-focused ROI applied</div></div><div><div class="sub">Screening interpretation</div><h3 style="margin:8px 0">${res.flag}</h3><p class="sub">This is an image-derived screening estimate only. Confirm with laboratory Hb/CBC before clinical decisions.</p></div></div>`:'<div class="notice warning">The image could not be assessed. Please capture a clear, well-lit close-up of the lower conjunctiva.</div>'}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="openCapture()">🔄 Retake</button>${res?'<button class="btn green" onclick="showReport()">Continue to Report →</button>':''}</div></div></div>`}
function showReport(){document.getElementById('app').innerHTML=`<div class="topline"><div><h1 class="title">Hb Screening Report</h1><div class="sub">Step 3 of 3 — Review and share</div></div></div><div class="card" id="report"><div class="reportBrand"><div><h2 style="margin:0">ADONIS Hb SCREEN</h2><div class="sub">Conjunctival image haemoglobin screening</div></div><div class="reportLogos"><img class="mv" src="assets/MV30.png" alt="MV30"><img class="ag" src="assets/AMINO-GLOBIN-XT.png" alt="Amino Globin-XT"></div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="grid g3"><div><div class="sub">Patient</div><b>${esc(current.patient.name||'Not provided')}</b></div><div><div class="sub">Age / Sex</div><b>${esc(current.patient.age||'—')} / ${esc(current.patient.sex||'—')}</b></div><div><div class="sub">Screening Date</div><b>${formatScreenDate()}</b><div class="sub" style="margin-top:3px">Time: ${formatScreenTime()}</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card" style="box-shadow:none;text-align:center"><div class="sub">Estimated haemoglobin</div><div class="reading">${current.result.estimate.toFixed(1)} g/dL</div><span class="pill ${current.result.quality==='Good'?'good':'warn'}">Image quality: ${current.result.quality}</span></div><div class="card" style="box-shadow:none"><div class="sub">Screening observation</div><h3>${current.result.flag}</h3><p class="sub">The result is derived from a photograph of the lower conjunctiva. It is a screening estimate and is not equivalent to a laboratory haemoglobin measurement.</p></div></div><div class="footerNote" style="margin-top:14px">Analysis engine: ${current.result.engine} · Result generated: ${formatScreenDate()} ${formatScreenTime()}</div><div class="notice warning" style="margin-top:16px"><b>Clinical safety:</b> Confirm haemoglobin with an appropriate laboratory/validated measurement before diagnosis, treatment or other clinical decisions. Do not rely on this screening estimate alone.</div></div><div class="row" style="justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button class="btn ghost" onclick="openCapture()">Retake</button><button class="btn primary" onclick="shareReport()">📤 Send to Doctor</button><button class="btn ghost" onclick="window.print()">🖨 Print / Save PDF</button><button class="btn green" onclick="saveAndNew()">Save & Next Patient →</button></div>`}
function reportText(){return `ADONIS Hb SCREEN — HAEMOGLOBIN SCREENING\nScreening Date: ${formatScreenDate()}\nScreening Time: ${formatScreenTime()}\nPatient: ${current.patient.name||'Not provided'}\nAge/Sex: ${current.patient.age||'—'} / ${current.patient.sex||'—'}\nEstimated Hb: ${current.result.estimate.toFixed(1)} g/dL\nImage quality: ${current.result.quality}\n${current.result.flag}\n\nThis is an image-derived screening estimate from a lower-conjunctival photograph. Confirm with laboratory/validated haemoglobin measurement before clinical decisions.`}
async function shareReport(){let text=reportText();if(navigator.share){try{await navigator.share({title:'Adonis Hb Screening Report',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);toast('Report copied. Paste into WhatsApp/email.')}}
function saveAndNew(){db.screenings.unshift({id:crypto.randomUUID?.()||Date.now().toString(),created:Date.now(),patient:current.patient,estimate:current.result.estimate,quality:current.result.quality,flag:current.result.flag});save();toast('Screening saved');setTimeout(()=>newScreening(),400)}
function dashboardInit(){dashboard()}dashboardInit();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
